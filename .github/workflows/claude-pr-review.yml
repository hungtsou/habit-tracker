name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Minimum permissions required by claude-code-action:
#   contents: read       — checkout the repo
#   pull-requests: write — post PR review comments
#   issues: write        — required by the action's comment API calls
#   id-token: write      — required to fetch an OIDC token for authentication
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is needed so Claude can see the complete diff context
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # --max-turns limits how many back-and-forth steps Claude takes (controls cost)
          # --model selects the Claude model; claude-sonnet-4-6 is the latest Sonnet alias
          claude_args: '--max-turns 30 --model claude-sonnet-4-6'
          prompt: |
            You are reviewing a pull request. Follow these steps exactly:

            1. Run `gh pr view $PR_NUMBER --json files,title,body` to list changed files.
            2. Run `gh pr diff $PR_NUMBER` to read the full diff.
            3. For each changed source file (skip `node_modules/`, `dist/`, `*.lock`, `package-lock.json`), read the full file with the Read tool so you have complete context — the diff alone can miss surrounding code.
            4. Write your review as a comment on the PR using `gh pr comment $PR_NUMBER --body "..."`.

            **Project standards to enforce:**
            - Response shape: success → `{ data: T }` via `sendSuccess()`, error → `{ error, statusCode }` via `sendError()` or `AppError`. Using `res.json()` directly is a violation.
            - Controllers must be thin — business logic belongs in `db/` query functions, not in controllers.
            - Middleware order on routes: `authenticate → validate(schema) → controller`. Any protected route missing `authenticate` is an auth bypass.
            - Zod schemas in `src/schemas/` with user-friendly error messages and `.transform()` for sanitization.
            - Parameterized queries only (`$1, $2` placeholders) — string interpolation of any variable into a SQL query is a SQL injection vulnerability, even inside a template literal.
            - Named exports only (no default exports except router files and `app`/`server`).
            - No `any` type — use `unknown` and narrow with type guards.
            - DB columns `snake_case`, TypeScript variables `camelCase`.
            - All PKs must be UUIDs.
            - HTTP status codes: `201 Created` for POST that creates a resource, `204 No Content` for DELETE, `200` for everything else.

            **Review these areas in order of priority:**

            1. **Security** — SQL injection (look for template literals or string concatenation in any `pool.query()` call), auth bypass (routes missing `authenticate`), secrets in code, OWASP Top 10.
            2. **Project standard violations** — anything that breaks the conventions above, especially `res.json()` instead of `sendSuccess()`, wrong HTTP status codes on create/delete endpoints.
            3. **Logic bugs** — incorrect behavior, missing edge cases, wrong status codes.
            4. **Test coverage** — are all exported functions from changed controllers covered? Are error paths and edge cases tested, or only the happy path?

            **Format your review comment exactly like this:**

            ## 🔴 Critical
            _Issues that must be fixed before merge (security holes, data loss risk)_

            ## 🟠 High
            _Likely bugs or clear standard violations_

            ## 🟡 Medium
            _Standard violations that reduce maintainability_

            ## 🟢 Low
            _Minor style or nitpicks_

            For each issue include: **file path + line number**, **what the problem is**, and **a concrete fix suggestion**.
            If a section has no findings, write `_None_` under it.
