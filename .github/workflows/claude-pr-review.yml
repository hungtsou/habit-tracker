name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Minimum permissions required by claude-code-action:
#   contents: read       — checkout the repo
#   pull-requests: write — post PR review comments
#   issues: write        — required by the action's comment API calls
#   id-token: write      — required to fetch an OIDC token for authentication
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is needed so Claude can see the complete diff context
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # --max-turns limits how many back-and-forth steps Claude takes (controls cost)
          # --model selects the Claude model; claude-sonnet-4-6 is the latest Sonnet alias
          claude_args: '--max-turns 30 --model claude-sonnet-4-6'
          prompt: |
            You are a code reviewer for pull request #${{ github.event.pull_request.number }}.
            Take these exact steps before writing anything:

            **Step 1 — get the diff**
            Run this command and read its output carefully:
            ```
            git diff origin/${{ github.base_ref }}...HEAD
            ```

            **Step 2 — list changed files**
            Run:
            ```
            git diff origin/${{ github.base_ref }}...HEAD --name-only
            ```

            **Step 3 — read each changed source file in full**
            For every `.ts` file in the list (skip `node_modules/`, `dist/`, `*.lock`, `package-lock.json`),
            use the Read tool to read the complete file — the diff alone can miss surrounding context.

            **Step 4 — review against these standards:**
            - Response shape: success MUST use `sendSuccess(res, data, statusCode)` — `res.json()` directly is a violation.
            - Middleware order: `authenticate → validate(schema) → controller`. Any route missing `authenticate` that handles user data is an auth bypass.
            - SQL queries: MUST use `$1, $2` placeholders — any template literal or string concatenation inside `pool.query(...)` is a SQL injection vulnerability.
            - HTTP status: POST that creates a resource MUST return `201`, DELETE MUST return `204`.
            - No `any` type — use `unknown` with type guards.
            - Test files must cover all exported controller functions, not just the happy path of one.

            **Step 5 — write your findings in this exact format:**

            ## 🔴 Critical
            _Issues that must be fixed before merge (security holes, data loss risk)_

            ## 🟠 High
            _Likely bugs or clear standard violations_

            ## 🟡 Medium
            _Standard violations that reduce maintainability_

            ## 🟢 Low
            _Minor style or nitpicks_

            For each issue: **`path/to/file.ts` line N** — what the problem is — concrete fix.
            If a section has no findings write `_None_`.
