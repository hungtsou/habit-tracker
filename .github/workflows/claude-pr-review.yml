name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- '*.ts' ':!dist/**' ':!*.lock' > /tmp/pr.diff
          git diff origin/${{ github.base_ref }}...HEAD --name-only \
            -- '*.ts' ':!dist/**' ':!*.lock' > /tmp/pr-files.txt

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--max-turns 10 --model claude-sonnet-4-6'
          prompt: |
            Read /tmp/pr-files.txt, then read /tmp/pr.diff.
            For each .ts file listed, also read its full contents using the Read tool.

            Check for:
            - SQL injection: any ${variable} interpolated inside a pool.query() call
            - Auth bypass: router.delete/get/post/put() with no `authenticate` argument
            - Wrong response shape: res.json() instead of sendSuccess()
            - Wrong status code: sendSuccess called with 200 on a POST create endpoint
            - Test coverage: controller exports with zero test coverage

            Write your findings to /tmp/review.md in this format:

            ## Claude PR Review

            ### 🔴 Critical
            ### 🟠 High
            ### 🟢 Test Coverage

            One line per finding: `file.ts` line N — problem — fix suggestion.
            Write _None_ in empty sections.

      - name: Post review as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s /tmp/review.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body-file /tmp/review.md
          fi
