name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--max-turns 10 --model claude-sonnet-4-6'
          prompt: |
            Review the changed files in this pull request.

            **Project standards to enforce (from CLAUDE.md):**
            - Response shape: success → `{ data: T }` via `sendSuccess()`, error → `{ error, statusCode }` via `sendError()` or `AppError`
            - Controllers must be thin — business logic belongs in `db/` query functions
            - Middleware order on routes: `authenticate → validate(schema) → controller`
            - Zod schemas in `src/schemas/` with user-friendly error messages and `.transform()` for sanitization
            - Parameterized queries only (`$1, $2`) — never interpolate user input into SQL strings
            - Named exports only (no default exports except router files and `app`/`server`)
            - No `any` type — use `unknown` and narrow with type guards
            - DB columns `snake_case`, TypeScript variables `camelCase`
            - All PKs must be UUIDs

            **Review these areas in order of priority:**

            1. **Security** — SQL injection, auth bypass, missing authentication on protected routes, secrets in code, OWASP Top 10
            2. **Project standard violations** — anything that breaks the conventions above
            3. **Logic bugs** — incorrect behavior, missing edge cases, wrong status codes
            4. **Test coverage** — missing unit/integration tests for changed logic

            **Format your review exactly like this:**

            ## 🔴 Critical
            _Issues that must be fixed before merge (security holes, data loss risk)_

            ## 🟠 High
            _Likely bugs or clear standard violations_

            ## 🟡 Medium
            _Standard violations that reduce maintainability_

            ## 🟢 Low
            _Minor style or nitpicks_

            For each issue include: **file path + approximate line**, **what the problem is**, and **a concrete fix suggestion**.
            Skip `node_modules/`, `dist/`, `*.lock`, `package-lock.json`.
