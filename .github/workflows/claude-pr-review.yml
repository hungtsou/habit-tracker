name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- '*.ts' ':!dist/**' ':!*.lock' > pr.diff
          git diff origin/${{ github.base_ref }}...HEAD --name-only \
            -- '*.ts' ':!dist/**' ':!*.lock' > pr-files.txt
          echo "=== Changed files ===" && cat pr-files.txt
          echo "=== Diff line count ===" && wc -l pr.diff

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--max-turns 10 --model claude-sonnet-4-6'
          prompt: |
            You are reviewing a pull request. Do the following steps in order:

            1. Read the file `pr-files.txt` — this lists every changed TypeScript file.
            2. Read the file `pr.diff` — this is the full diff.
            3. For each file in pr-files.txt, use the Read tool to read its full contents.
            4. Review for these issues:
               - SQL injection: a ${variable} inside a template literal passed to pool.query()
               - Auth bypass: a router.get/post/put/delete() call with no `authenticate` middleware
               - Wrong response shape: res.json() used instead of sendSuccess()
               - Wrong HTTP status: sendSuccess called with 200 on a POST that creates a resource
               - Test coverage: exported controller functions with no tests at all
            5. Write your complete review to the file `pr-review.md` using the Write tool.
               Use this exact format:

               ## Claude PR Review

               ### 🔴 Critical
               _Security issues_

               ### 🟠 High
               _Bugs and standard violations_

               ### 🟢 Test Coverage
               _Missing tests_

               One line per finding: `file.ts` line N — problem — fix.
               Write _None_ in sections with no findings.

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Checking for review file ==="
          ls -la pr-review.md 2>/dev/null || echo "pr-review.md not found"
          if [ -s pr-review.md ]; then
            echo "=== Posting comment ==="
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body-file pr-review.md
          else
            echo "=== No review file, posting fallback ==="
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body "⚠️ Claude review ran but produced no output. Check the workflow logs."
          fi
