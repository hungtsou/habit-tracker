name: Claude PR Review (CLI)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so git diff can reach the base branch

      - name: Generate PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}..HEAD \
            -- '*.ts' '*.js' \
            ':!dist/**' \
            ':!*.generated.ts' \
            > pr_diff.txt
          [ -s pr_diff.txt ] && echo "empty=false" >> $GITHUB_OUTPUT \
                              || echo "empty=true"  >> $GITHUB_OUTPUT

      - name: Install Claude CLI
        if: steps.diff.outputs.empty == 'false'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Review
        if: steps.diff.outputs.empty == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW=$(cat pr_diff.txt | claude -p \
            'Return ONLY a valid JSON array — no markdown fences, no explanation.
            Each element must be exactly: {"file": string, "line": number, "severity": "CRITICAL"|"HIGH"|"MEDIUM"|"LOW", "body": string}

            Project standards to enforce:
            - Response shape: sendSuccess() for success, sendError()/AppError for errors
            - Controllers must be thin — business logic belongs in db/ query functions
            - Middleware order on routes: authenticate → validate(schema) → controller
            - Parameterized queries only ($1, $2) — never interpolate user input into SQL
            - Named exports only (no default exports except router files and app/server)
            - No "any" type — use unknown and narrow with type guards
            - DB columns snake_case, TypeScript variables camelCase

            Review in priority order:
            1. Security — SQL injection, auth bypass, missing auth on protected routes, OWASP Top 10
            2. Standard violations — anything breaking the conventions above
            3. Logic bugs — wrong status codes, missing edge cases, incorrect behavior
            4. Test coverage — missing unit/integration tests for changed logic

            Line numbers must reference the RIGHT side of the diff (the new file version).
            Only report real issues. Return [] if none found.' \
            --output-format json)

          # Parse findings — strip markdown fences Claude may add despite instructions
          FINDINGS=$(echo "$RAW" | jq -r '.result' \
            | sed 's/^```json//' | sed 's/^```//' | sed 's/```$//' \
            | jq 'if type == "array" then . else [] end' 2>/dev/null \
            || echo '[]')

          COUNT=$(echo "$FINDINGS" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            gh pr comment ${{ github.event.number }} \
              --body "## Claude PR Review

          ✅ No issues found in the changed files."
            exit 0
          fi

          C=$(echo "$FINDINGS" | jq '[.[] | select(.severity=="CRITICAL")] | length')
          H=$(echo "$FINDINGS" | jq '[.[] | select(.severity=="HIGH")]   | length')
          M=$(echo "$FINDINGS" | jq '[.[] | select(.severity=="MEDIUM")]  | length')
          L=$(echo "$FINDINGS" | jq '[.[] | select(.severity=="LOW")]     | length')

          SUMMARY="## Claude PR Review

          🔴 Critical: $C  🟠 High: $H  🟡 Medium: $M  🟢 Low: $L"

          # Build GitHub review comments — each anchored to a specific diff line
          COMMENTS=$(echo "$FINDINGS" | jq '[.[] | {
            path: .file,
            line: .line,
            side: "RIGHT",
            body: ("[**\(.severity)**] \(.body)")
          }]')

          # Write payload to file to avoid shell-escaping issues with nested JSON
          jq -n \
            --arg     body     "$SUMMARY" \
            --argjson comments "$COMMENTS" \
            '{body: $body, event: "COMMENT", comments: $comments}' \
            > review_payload.json

          # Post inline review; fall back to a plain PR comment if any line
          # position is outside the diff (GitHub rejects the whole request in that case)
          if ! gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/reviews" \
               --method POST --input review_payload.json 2>/dev/null; then

            PLAIN=$(echo "$FINDINGS" | jq -r \
              '.[] | "**[\(.severity)]** `\(.file):\(.line)` — \(.body)"')

            gh pr comment ${{ github.event.number }} \
              --body "$SUMMARY

          ---
          $PLAIN

          > ⚠️ Inline comments failed (line positions may be outside the diff). Findings listed above."
          fi

      - name: Extract changed symbols for Stage 2
        id: symbols
        if: steps.diff.outputs.empty == 'false'
        run: |
          python3 - <<'PYEOF'
          import re, json, os

          current_file = None
          entries = {}

          EXPORT_RE = re.compile(
              r'^[+-]\s*export\s+(?:async\s+)?'
              r'(?:function|const|class|interface|type|enum)\s+'
              r'([A-Za-z_$][A-Za-z0-9_$]*)'
          )

          with open('pr_diff.txt') as f:
              for line in f:
                  line = line.rstrip('\n')
                  if line.startswith('+++ b/'):
                      current_file = line[6:]
                      continue
                  if current_file is None or '.test.' in current_file or '.spec.' in current_file:
                      continue
                  m = EXPORT_RE.match(line)
                  if m:
                      symbol = m.group(1)
                      key = (current_file, symbol)
                      entries[key] = {"file": current_file, "symbol": symbol,
                                      "change": "added" if line[0] == '+' else "removed"}

          result = list(entries.values())
          with open('changed_symbols.json', 'w') as out:
              json.dump(result, out)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh:
              gh.write(f"symbols_empty={'true' if not result else 'false'}\n")
          PYEOF

      - name: Run Claude Cross-File Review (Stage 2)
        if: steps.diff.outputs.empty == 'false' && steps.symbols.outputs.symbols_empty == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYMBOLS=$(cat changed_symbols.json)

          RAW2=$(printf 'CHANGED_SYMBOLS_JSON:\n%s' "$SYMBOLS" \
            | claude -p "$(cat .claude/agents/cross-file-reviewer.md)" \
            --allowedTools "Agent,Bash,Read" \
            --max-turns 40 \
            --output-format json 2>/dev/null)

          # Parse findings — strip markdown fences Claude may add despite instructions
          FINDINGS2=$(printf '%s' "$RAW2" | jq -r '.result // empty' \
            | sed 's/^```json//' | sed 's/^```//' | sed 's/```$//' \
            | jq 'if type == "array" then . else [] end' 2>/dev/null \
            || echo '[]')

          COUNT2=$(printf '%s' "$FINDINGS2" | jq 'length')

          if [ "$COUNT2" -eq 0 ]; then
            gh pr comment ${{ github.event.number }} \
              --body "## Claude Cross-File Review (Stage 2)

          ✅ No cross-file consistency issues found."
            exit 0
          fi

          C2=$(printf '%s' "$FINDINGS2" | jq '[.[] | select(.severity=="CRITICAL")] | length')
          H2=$(printf '%s' "$FINDINGS2" | jq '[.[] | select(.severity=="HIGH")]   | length')
          M2=$(printf '%s' "$FINDINGS2" | jq '[.[] | select(.severity=="MEDIUM")]  | length')
          L2=$(printf '%s' "$FINDINGS2" | jq '[.[] | select(.severity=="LOW")]     | length')

          PLAIN2=$(printf '%s' "$FINDINGS2" | jq -r \
            '.[] | "**[\(.severity)]** `\(.file)` — \(.issue)"')

          gh pr comment ${{ github.event.number }} \
            --body "## Claude Cross-File Review (Stage 2)

          🔴 Critical: $C2  🟠 High: $H2  🟡 Medium: $M2  🟢 Low: $L2

          ---
          $PLAIN2

          > ⚠️ These findings reference files outside the diff and cannot be posted as inline comments."
