name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed to post review comments

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate diffs

      - name: Generate PR diff
        run: |
          git diff origin/${{ github.base_ref }}..HEAD \
            -- '*.ts' '*.js' '*.py' '*.go' > pr_diff.txt

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for gh cli
        run: |
          # Pipe the diff directly to Claude — no extra scripts needed
          REVIEW=$(cat pr_diff.txt | claude -p \
            "Senior engineer code review. review code standards from @Claude.md file and project conventions, Flag [HIGH]/[MED]/[LOW] issues.
             Focus: security, performance, logic errors, maintainability.
             Include file name and line number for each finding." \
            --output-format json)

          # Extract the text result and post as a PR comment
          gh pr comment ${{ github.event.number }} \
            --body "## 🤖 Claude Code Review
          $(echo "$REVIEW" | jq -r '.result')"
